// ── 빌드 상태 배너 — "돌았는지·성공했는지"를 한눈에(2026-07-27) ──
// build_status.json은 매 실행 갱신(실패도 weekly_update.sh가 푸시). 런타임 fetch라 stale 페이지도 최신 상태 표시.
(function(){
  fetch('build_status.json?_='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(s){
    if(!s) return;
    var el=document.getElementById('status'); if(!el) return;
    var run=s.last_run||''; var days=null;
    var m=run.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(m){ var d=new Date(+m[1],+m[2]-1,+m[3]); days=Math.floor((Date.now()-d.getTime())/86400000); }
    var ago=days==null?'':(days<=0?'오늘':days+'일 전');
    var res=s.result||'?', cls, icon;
    if(res==='성공'){ cls=(days!=null&&days>8)?'st-warn':'st-ok'; icon=(days!=null&&days>8)?'🟠':'🟢'; }
    else { cls='st-err'; icon='🔴'; }
    var msg=icon+' 마지막 자동 수집: '+esc(run)+' · '+esc(res)+(ago?' ('+ago+')':'');
    if(res!=='성공') msg+=' <small>— 로그 확인 필요</small>';
    else if(days!=null&&days>8) msg+=' <small>— 8일 넘게 갱신 없음(스케줄러/맥 확인)</small>';
    else if(s.build) msg+=' <small>· BUILD '+esc(s.build)+(s.changes?' · 신규 '+(s.changes.add||0)+'·전이 '+(s.changes.trans||0):'')+'</small>';
    el.className='status '+cls; el.innerHTML=msg; el.style.display='';
  }).catch(function(){});
})();
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function rows(items,cols){return items.map(function(i){return '<tr>'+cols.map(function(c){return '<td>'+esc(i[c])+'</td>';}).join('')+'</tr>';}).join('');}
function tbl(head,items,cols){return items&&items.length?('<table><tr>'+head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+rows(items,cols)+'</table>'):'<p class="note">없음</p>';}

    +'<h2>신호유형별 증감</h2>'+tbl(['유형','신규','제거','통합 흡수','개통 완결'],r.files,['file','add','rem','merged','opened'])
    +'<h2>신규 대형(S·A급)</h2>'+tbl(['등급','지역','사업','출처'],r.new_big,['lvl','sd','name','src'])
    +'<h2>단계 전이 (해당 주 도달)</h2>'+tbl(['사업','도달 단계'],r.transitions,['name','phase'])
    +'<h2>정비 완료 처리 (완공 확인)</h2>'+tbl(['지역','구역'],r.jeongbi_done_new,['sd','name']);
  var prev=ARCH[idx+1];
  document.getElementById('cmp').textContent=prev?('직전 회전 '+prev.date+' 대비'):'가장 오래된 기록';
}
document.getElementById('wk').addEventListener('change',function(e){render(+e.target.value);});
render(0);
</script>
